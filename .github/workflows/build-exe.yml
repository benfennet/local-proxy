name: build-windows-exe

# 手动触发或打 v* 标签时，把 tvproxy.py 打成 Windows 单文件 exe：
# 产物挂在本次运行的 Artifacts 里；打标签时同时发布到 Release。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build tvproxy.exe (single file)
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name tvproxy tvproxy.py
      - uses: actions/upload-artifact@v4
        with:
          name: tvproxy-windows
          path: dist/tvproxy.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tvproxy.exe
